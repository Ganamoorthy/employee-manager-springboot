<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Employee Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:fragment="alerts">
    <p th:if="${success}" class="alert-success" th:text="${success}"></p>
    <p th:if="${error}" class="alert-error" th:text="${error}"></p>
</div>
</body>
</html>
